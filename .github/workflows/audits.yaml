name: audits

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: "ubuntu-latest"
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        php:
          - 8.1
          - 8.2
          - 8.3
          - 8.4
        laravel:
          - "10.x"
          - "11.x"
        experimental:
          - false
        exclude:
          - php: 8.1
            laravel: "11.x"
          - php: 8.4
            laravel: "10.x"

    name: Laravel:${{ matrix.laravel }} / PHP:${{ matrix.php }} Code Audit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, sqlite3, pdo_sqlite, pdo_mysql, bcmath, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Install Laravel ${{ matrix.laravel }}
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update

      - name: Install dependencies
        uses: "ramsey/composer-install@v3"
        with:
          dependency-versions: "highest"
          composer-options: "--prefer-dist --prefer-stable --no-cache"

      - name: Installed dependencies
        run: composer show -D

      - name: Audit dependencies
        run: composer audit
