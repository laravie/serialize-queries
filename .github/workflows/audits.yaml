name: audits

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: "ubuntu-latest"
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        php:
          - 8.1
          - 8.2
          - 8.3
          - 8.4
          - 8.5
        laravel:
          - "13.x"
          - "12.x"
          - "11.x"
          - "10.x"
        experimental:
          - false
        exclude:
          - php: 8.2
            laravel: "13.x"
          - php: 8.1
            laravel: "13.x"
          - php: 8.1
            laravel: "12.x"
          - php: 8.5
            laravel: "11.x"
          - php: 8.1
            laravel: "11.x"
          - php: 8.5
            laravel: "10.x"
          - php: 8.4
            laravel: "10.x"

    name: Laravel:${{ matrix.laravel }} / PHP:${{ matrix.php }} Code Audit

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, sqlite3, pdo_sqlite, pdo_mysql, bcmath, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: "highest"
          composer-options: "--prefer-dist --prefer-stable --no-cache --with=laravel/framework:${{ matrix.laravel }}"

      - name: Installed dependencies
        run: composer show -D

      - name: Audit dependencies
        run: composer audit
