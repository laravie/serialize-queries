name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 3'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
        php:
          - 8.1
          - 8.2
          - 8.3
          - 8.4
          - 8.5
        laravel:
          - "13.x"
          - "12.x"
          - "11.x"
          - "10.x"
        dependencies:
          - "highest"
          - "lowest"
        experimental:
          - false
        exclude:
          - php: 8.2
            laravel: "13.x"
          - php: 8.1
            laravel: "13.x"
          - php: 8.1
            laravel: "12.x"
          - php: 8.5
            laravel: "11.x"
          - php: 8.1
            laravel: "11.x"
          - php: 8.5
            laravel: "10.x"
          - php: 8.4
            laravel: "10.x"

    name: Laravel:${{ matrix.laravel }} / PHP:${{ matrix.php }} / OS:${{ matrix.os }} ${{ matrix.dependencies == 'highest' && '⬆️' || '⬇️' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, sqlite3, pdo_sqlite, pdo_mysql, bcmath, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: "${{ matrix.dependencies }}"
          composer-options: "--prefer-dist --no-cache --with=laravel/framework:${{ matrix.laravel }}"

      - name: Installed dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/phpunit
